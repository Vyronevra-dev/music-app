<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <meta name="theme-color" content="#F4A6A0" />
    <link rel="manifest" href="manifest.json" />

    <!--Favicon-->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>

    <div class="app">

        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Meloflix</h1>
                <button class="upload-btn">+ Add Songs</button>
                <input type="file" id="file-input" accept=".mp3" multiple hidden />
            </div>

            <ul id="playlist" class="playlist">
                <h2>Your Playlist</h2>

                <!--playlist.js adds songs here-->

            </ul>
        </aside>

        <main class="main">
            <div class="cover">
                <img src="assets/SLEEK_SILVER_MUSIC_NOTE.png" alt="cover" id="cover-art" onerror="this.src='assets/SLEEK_SILVER_MUSIC_NOTE.png'"/>
            </div>

            <div class="song-info">
                <h2 id="song-title">No song selected</h2>
                <p id="song-artist"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic-vocal preview-icon"><path d="m11 7.601-5.994 8.19a1 1 0 0 0 .1 1.298l.817.818a1 1 0 0 0 1.314.087L15.09 12"/><path d="M16.5 21.174C15.5 20.5 14.372 20 13 20c-2.058 0-3.928 2.356-6 2-2.072-.356-2.775-3.369-1.5-4.5"/><circle cx="16" cy="7" r="5"/></svg> Unknown Artist</p>
            </div>

            <div class="progress-bar">
                <div class="time">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>

                <input type="range" id="seek-bar" value="0" />
            </div>

            <div class="controls">
                <button id="shuffle-btn" data-title="Shuffle Songs"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shuffle preview-icon"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg></button>
                <button id="prev-btn" data-title="Previous Song"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-skip-back preview-icon"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M3 20V4"/></svg></button>
                <button id="play-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8D8D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play preview-icon"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></button>
                <button id="next-btn" data-title="Next Song"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-skip-forward preview-icon"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg></button>
                <button id="repeat-btn" data-title="Repeat Song"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-repeat-off preview-icon"><path d="M11.656 6H21l-4-4"/><path d="M17.898 17.898A4 4 0 0 1 17 18H3l4-4"/><path d="m2 2 20 20"/><path d="M21 13v1a4 4 0 0 1-.171 1.159"/><path d="m21 6-4 4"/><path d="M3 11v-1a4 4 0 0 1 3.102-3.898"/><path d="m7 22-4-4"/></svg></button>
                <button id="settings-btn" data-title="Settings"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings preview-icon"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 10v6M4.22 4.22l4.24 4.24m11.32 11.32l4.24 4.24M1 12h6m10 0h6"/></svg></button>
            </div>

        </main>

    </div>

    <audio id="audio"></audio>

    <!-- Settings Popup -->
    <div class="popup-overlay" id="settings-popup">
        <div class="popup">
            <div class="popup-header">
                <h3>Audio Settings</h3>
                <button class="popup-close" id="popup-close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="popup-body">
                <!-- Volume -->
                <div class="control-group">
                    <div class="control-label">
                        <span class="control-name"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume-1"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg>Volume</span>
                        <span class="control-value" id="volume-value">100%</span>
                    </div>
                    <input type="range" id="popup-volume" min="0" max="100" value="100">
                </div>
                <!-- Speed -->
                <div class="control-group">
                    <div class="control-label">
                        <span class="control-name"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-timer"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/><path d="M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0z"/></svg>Speed</span>
                        <span class="control-value" id="speed-value">1.0x</span>
                    </div>
                    <input type="range" id="popup-speed" min="0.25" max="2" step="0.01" value="1">
                </div>
                <!-- Pitch -->
                <div class="control-group">
                    <div class="control-label">
                        <span class="control-name"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic"><path d="M12 2a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 12v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="9" y1="23" x2="15" y2="23"/></svg>Pitch</span>
                        <span class="control-value" id="pitch-value">1.0x</span>
                    </div>
                    <input type="range" id="popup-pitch" min="0.5" max="1.5" step="0.01" value="1">
                </div>
                <!-- Bass -->
                <div class="control-group">
                    <div class="control-label">
                        <span class="control-name"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trending-down"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>Bass</span>
                        <span class="control-value" id="bass-value">0 dB</span>
                    </div>
                    <input type="range" id="popup-bass" min="-20" max="20" step="1" value="0">
                </div>
                <!-- Treble -->
                <div class="control-group">
                    <div class="control-label">
                        <span class="control-name"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trending-up"><path d="M12 19V5"/><path d="M5 12l7 7 7-7"/></svg>Treble</span>
                        <span class="control-value" id="treble-value">0 dB</span>
                    </div>
                    <input type="range" id="popup-treble" min="-20" max="20" step="1" value="0">
                </div>
                <!-- Balance -->
                <div class="control-group">
                    <div class="control-label">
                        <span class="control-name"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-speaker"><path d="M12 3v2m0 14v2"/><path d="M8 8a4 4 0 0 1 8 0v4a4 4 0 1 1-8 0V8z"/></svg>Balance</span>
                        <span class="control-value" id="balance-value">Center</span>
                    </div>
                    <input type="range" id="popup-balance" min="-1" max="1" step="0.01" value="0">
                </div>
            </div>
            <div class="popup-footer">
                <button class="reset-btn" id="reset-settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw"><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 9 9 9 9 0 0 1-9 9 9 9 0 0 1-9-9z"/><path d="M12 8v4l2 2"/></svg>
                    Reset All
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="js/playlist.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
